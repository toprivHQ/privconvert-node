name: Release

# Publishing uses npm Trusted Publishing: npm accepts a short-lived token
# issued to this workflow only, and attaches a provenance statement linking
# the package to this commit. No npm token is stored anywhere.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Tag must match package version
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - run: npm install -g npm@11.21.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm publish --provenance --access public
